services:
  app:
    build:
      context: ".docker/app"
      args:
        PHP_VERSION: "8.4"
        HOST_USER_ID: "${HOST_USER_ID:-1000}"
        HOST_GROUP_ID: "${HOST_GROUP_ID:-1000}"
    restart: "unless-stopped"
    volumes:
      - ".:/var/www/glpi:rw"
      - "custom_php_ini:/usr/local/etc/php/custom_conf.d/:rw"
      - "./.docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro"
    ports:
      - "8081:80"
    environment:
      GLPI_ENVIRONMENT_TYPE: "production"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: "mariadb:11.8"
    restart: "unless-stopped"
    volumes:
      - "db:/var/lib/mysql"
      - ".docker/initdb/glpi.sql:/docker-entrypoint-initdb.d/initdb.sql:ro"
    environment:
      MARIADB_ROOT_PASSWORD: "glpi"
      MARIADB_DATABASE: "glpi"
      MARIADB_USER: "glpi"
      MARIADB_PASSWORD: "glpi"
    expose:
      - "3306"

volumes:
  db:
  custom_php_ini:
